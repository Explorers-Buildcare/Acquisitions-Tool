<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New feasibility — Explorers Acquisitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
.idx a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-size:13.5px}
.idx a.on{background:var(--sage);color:var(--pine-ink);font-weight:600}
.idx .n{width:20px;height:20px;border-radius:50%;background:var(--oat);color:var(--ink-2);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.idx a.done .n{background:var(--pine);color:#fff}
.sec{display:flex;flex-direction:column;gap:16px}
.sec h2{display:flex;align-items:center;gap:10px}
.sec h2 .n{width:24px;height:24px;border-radius:50%;background:var(--pine);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.sec .hint{margin:-8px 0 0;font-size:13px;color:var(--ink-3)}
.nearby{display:flex;gap:12px;align-items:center;border:1px solid var(--rule-2);border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer}
.nearby input{width:18px;height:18px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/pages/input.js"></script>
</body>
</html>
