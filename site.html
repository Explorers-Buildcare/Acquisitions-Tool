<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site — Explorers Acquisitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
.cols{display:flex;align-items:flex-end;gap:14px;height:140px;padding:0 6px;border-bottom:1px solid var(--rule-2)}
.cols>div{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.cols .col{width:28px;border-radius:4px 4px 0 0;background:var(--moss)}
.cols .col.first{background:var(--pine)}
.axis{display:flex;gap:14px;padding:6px 6px 0;font-size:11.5px;color:var(--ink-3)}
.axis span{flex:1;text-align:center}
.map{height:200px;background:var(--sage);position:relative;display:flex;align-items:center;justify-content:center;color:var(--pine-ink);font-size:12.5px;font-weight:600;border-radius:var(--r-l) var(--r-l) 0 0;overflow:hidden}
.map .grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--sage-2) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--sage-2) 23px 24px)}
.legend{padding:14px 18px;display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dots{display:flex;flex-direction:column;gap:8px;font-size:13px}
.dots>div{display:flex;gap:8px;align-items:center}
.dots .dot{width:8px;height:8px}
.dots .dot.ok{background:var(--pine)}.dots .dot.miss{background:var(--brush)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/pages/site.js"></script>
</body>
</html>
